buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.13.0' }
}
apply plugin: 'com.android.application'

android {
    namespace 'com.cn.media.playback.coexist'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cn.media.playback.coexist'
        minSdk 21
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
    }
}

dependencies {
    implementation files(providers.gradleProperty('playbackAar').get())
    implementation project(':companion')
}
