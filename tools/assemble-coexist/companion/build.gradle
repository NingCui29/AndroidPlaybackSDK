apply plugin: 'com.android.library'

android {
    namespace 'com.cn.media.companionfixture'
    compileSdk 35
    ndkVersion '30.0.16248370'
    defaultConfig {
        minSdk 23
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments "-DDUPLICATE_NAME=" + providers.gradleProperty('duplicateName').getOrElse('OFF') }
        }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
}
