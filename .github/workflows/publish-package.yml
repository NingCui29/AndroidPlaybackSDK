name: Publish to GitHub Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  packages: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Offline Maven Repo & Upload to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: NingCui29
          REPO: AndroidPlaybackSDK
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Searching offline-maven.zip for version $TAG_VERSION ($GITHUB_REF_NAME)..."
          ZIP_FILE=$(find artifacts/distribution/$TAG_VERSION -name "offline-maven.zip" 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Tag-specific path not found, falling back to latest under artifacts/distribution..."
            ZIP_FILE=$(find artifacts/distribution -name "offline-maven.zip" | sort -V | tail -n 1)
          fi
          echo "Using release artifact: $ZIP_FILE"
          mkdir -p /tmp/maven-repo
          unzip "$ZIP_FILE" -d /tmp/maven-repo
          
          echo "Uploading Maven artifacts to GitHub Packages..."
          cd /tmp/maven-repo
          find . -type f | while read -r file; do
            clean_path=$(echo "$file" | sed 's|^\./||')
            target_url="https://maven.pkg.github.com/${OWNER}/${REPO}/${clean_path}"
            echo "Uploading: $clean_path -> $target_url"
            curl -s -f -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "User-Agent: GitHub-Actions" \
              -T "$file" \
              "$target_url" || echo "Warning: failed to upload $clean_path"
          done
          echo "Publish completed successfully."
